name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-bsd*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已有的标签（例如 v0.1.0）
        required: true

jobs:
  package:
    name: package (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: docker.io/library/archlinux:latest
          - distro: debian
            image: docker.io/library/debian:trixie
          - distro: ubuntu
            image: docker.io/library/ubuntu:26.10
          - distro: fedora
            image: registry.fedoraproject.org/fedora:44
    container: ${{ matrix.image }}
    steps:
      - name: Install git
        run: |
          command -v git && exit 0
          if command -v pacman; then pacman -Syu --noconfirm git
          elif command -v apt-get; then apt-get update -qq && apt-get install -y -qq git ca-certificates
          else dnf install -y -q git; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install build dependencies
        run: packaging/ci/deps.sh ${{ matrix.distro }}
      - name: Check tag matches VERSION
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          V="v$(cat VERSION)"
          [ "$TAG" = "$V" ] || { echo "标签 $TAG 与 VERSION ($V) 不一致" >&2; exit 1; }
      - name: Build package
        run: packaging/ci/package.sh ${{ matrix.distro }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$TAG" dist/* --prerelease --title "MinIME $TAG" --notes-file .github/release-notes.md
